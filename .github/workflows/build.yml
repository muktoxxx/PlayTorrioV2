name: PlayTorrio CI

on:
  # Run automatically on pushes and PRs to main
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allow manual run with a dropdown in the Actions tab
  workflow_dispatch:
    inputs:
      platform:
        description: "What to build"
        required: true
        default: android
        type: choice
        options:
          - android
          - windows
          - linux

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-latest
    
    runs-on: ${{ matrix.runner }}
    
    # For workflow_dispatch, build only the selected platform
    # For push/PR, build all platforms
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.platform == matrix.platform

    env:
      FLUTTER_CHANNEL: stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Android keystore (if android)
        if: ${{ matrix.platform == 'android' && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
storeFile=upload-keystore.jks
EOF
        shell: bash

      - name: Run Android build
        if: ${{ matrix.platform == 'android' }}
        run: flutter build apk
        shell: bash

      - name: Run Windows build
        if: ${{ matrix.platform == 'windows' }}
        run: flutter build windows
        shell: pwsh

      - name: Run Linux build
        if: ${{ matrix.platform == 'linux' }}
        run: flutter build linux
        shell: bash

      - name: Upload Android artifacts
        if: ${{ matrix.platform == 'android' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload Windows artifacts
        if: ${{ matrix.platform == 'windows' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: build/windows/**/Runner.exe

      - name: Upload Linux artifacts
        if: ${{ matrix.platform == 'linux' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: build/linux/**/bundle
